name: Empaquetar tema SSRL

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  package-theme:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Crear ZIP del tema
        run: |
          cd ssrl
          zip -r ../ssrl.zip . -x ".git/*"

      - name: Adjuntar ZIP a la release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" ssrl.zip --clobber

      - name: Guardar ZIP como artefacto
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ssrl-theme
          path: ssrl.zip
